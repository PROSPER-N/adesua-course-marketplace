name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        # Wait until MongoDB accepts connections, so the tests don't start too early.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    # Test-only values for the throwaway database in this job. They aren't used anywhere else.
    env:
      NODE_ENV: test
      MONGO_URI: mongodb://localhost:27017/adesua_dev_ci
      MONGO_URI_TEST: mongodb://localhost:27017/adesua_test_ci
      JWT_SECRET: ci-only-fake-secret-not-used-anywhere-else
      JWT_EXPIRES_IN: 7d
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run the tests
        run: npm test

  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # These steps run when frontend/ exists. Without it, they're skipped and the job passes.
      - uses: actions/setup-node@v7
        if: hashFiles('frontend/package.json') != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: hashFiles('frontend/package.json') != ''
        run: npm ci
      - name: Lint
        if: hashFiles('frontend/package.json') != ''
        run: npm run lint
      - name: Currency tests
        if: hashFiles('frontend/package.json') != ''
        run: npm run test:currency
      # Prettier isn't a dependency, so the version is pinned here. A new release can't fail the check.
      # It uses the frontend override in the root .prettierrc.
      - name: Check formatting
        if: hashFiles('frontend/package.json') != ''
        run: npx --yes prettier@3.9.9 --check "src/**/*.{js,jsx,css}" index.html vite.config.js package.json .oxlintrc.json vercel.json
      - name: Build
        if: hashFiles('frontend/package.json') != ''
        run: npm run build
