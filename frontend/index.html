<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Fraunces:opsz,wght@9..144,400..700&family=Instrument+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1E6B4A" />
    <script>
      // Sets the theme before anything is drawn, so a dark page never flashes white first.
      // src/utils/theme.js keeps it up to date once the app has loaded.
      {
        let choice = 'system'
        try {
          choice = localStorage.getItem('adesua-theme') ?? 'system'
        } catch {
          // Storage is blocked, so the device setting decides.
        }
        const dark =
          choice === 'dark' ||
          (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        const theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#0e1512' : '#1e6b4a')
      }
    </script>
    <title>Adesua</title>
    <meta
      name="description"
      content="Adesua is a video course marketplace. Learn coding, design, business, marketing and photography, or publish a course of your own."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Adesua" />
    <meta property="og:title" content="Adesua: learn something useful on your lunch break" />
    <meta
      property="og:description"
      content="Video courses in coding, design, business, marketing and photography. Most lessons take 30 minutes or less."
    />
    <meta property="og:image" content="https://adesua-course-marketplace.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Adesua logo and the line: Learn something useful on your lunch break."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Adesua: learn something useful on your lunch break" />
    <meta
      name="twitter:description"
      content="Video courses in coding, design, business, marketing and photography. Most lessons take 30 minutes or less."
    />
    <meta
      name="twitter:image"
      content="https://adesua-course-marketplace.vercel.app/og-image.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
